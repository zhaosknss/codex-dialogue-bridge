name: Plugin checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
      - name: Install the fixed core dependency
        run: python -m pip install -r requirements.txt
      - name: Run fictional behavior checks
        run: python -B -m unittest discover -s tests -v
      - name: Run the fictional collaboration example
        run: python -B plugins/dialogue-bridge/scripts/demo.py --directory local-data/ci-demo
      - name: Run the fictional saved-background example
        run: python -B plugins/dialogue-bridge/scripts/context_demo.py --directory local-data/ci-context-demo
      - name: Run the fictional understanding workflow
        run: python -B plugins/dialogue-bridge/scripts/understanding_demo.py
